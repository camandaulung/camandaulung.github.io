<!DOCTYPE html>
<!-- Trang chu cua cong. NGUON o repo nay: portal/index.html
     CI chep no sang <repo-portal>/index.html. Dung sua thang ben repo portal. -->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cá Mặn · Cổng vào</title>
  <meta name="description" content="Cá Mặn — bản tin mỗi sáng và vài minigame.">
  <meta name="theme-color" content="#071613">
  <meta property="og:title" content="Cá Mặn · Cổng vào">
  <meta property="og:description" content="Bản tin mỗi sáng và vài minigame. Chọn một cửa để vào.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #071613;
      --bg-2: #0a201b;
      --ink: #eaf6f0;
      --muted: #9db8ad;
      --faint: #6f8c81;
      --morning: #38e0a0;
      --morning-deep: #1f7a58;
      --game: #ff9d6c;
      --game-deep: #c8623a;
      --card: rgba(255, 255, 255, 0.028);
      --card-line: rgba(255, 255, 255, 0.09);
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-display: 'Newsreader', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.55;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ── Ambient deep-sea background ───────────────────────────── */
    .aurora {
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 90vh;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(48% 55% at 22% 18%, rgba(56, 224, 160, 0.16), transparent 70%),
        radial-gradient(40% 50% at 82% 12%, rgba(255, 157, 108, 0.12), transparent 72%),
        radial-gradient(60% 60% at 50% 120%, rgba(31, 122, 88, 0.20), transparent 70%);
      filter: blur(8px);
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1.02); }
      to   { transform: translate3d(3%, 2%, 0) scale(1.08); }
    }

    .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bubbles span {
      position: absolute;
      bottom: -8vh;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.5), rgba(56, 224, 160, 0.06) 60%, transparent);
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.18);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      12%  { opacity: 0.7; }
      100% { transform: translateY(-118vh) translateX(var(--sway, 20px)); opacity: 0; }
    }

    .grain {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.04;
      background-image: radial-gradient(rgba(255,255,255,0.7) 0.5px, transparent 0.6px);
      background-size: 3px 3px;
    }

    /* ── Shell ─────────────────────────────────────────────────── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(22px, 4vw, 40px) clamp(20px, 5vw, 48px) 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; }
    .brand-fish {
      font-size: 24px;
      filter: drop-shadow(0 3px 8px rgba(56, 224, 160, 0.4));
      animation: bob 4.5s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
    .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }
    .brand-name em { color: var(--morning); font-style: normal; }
    .topline .tag {
      font-size: 12px; color: var(--faint); letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid var(--card-line); border-radius: 999px; padding: 6px 13px;
    }

    /* ── Hero ──────────────────────────────────────────────────── */
    .hero { margin-top: clamp(48px, 11vw, 104px); max-width: 720px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--morning);
      margin-bottom: 20px;
    }
    .eyebrow::before { content: ''; width: 26px; height: 1px; background: var(--morning); opacity: 0.7; }
    .hero h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(38px, 7.2vw, 74px);
      line-height: 1.02;
      letter-spacing: -0.015em;
    }
    .hero h1 .swim {
      background: linear-gradient(100deg, var(--morning), #7ff0c6 40%, var(--game) 92%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p {
      margin-top: 22px; font-size: clamp(15px, 2vw, 18px); color: var(--muted); max-width: 56ch;
    }

    /* ── Portals ───────────────────────────────────────────────── */
    .portals {
      margin-top: clamp(40px, 7vw, 72px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(16px, 2.4vw, 24px);
    }
    @media (max-width: 720px) { .portals { grid-template-columns: 1fr; } }

    .portal {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 268px;
      padding: 26px 26px 24px;
      border: 1px solid var(--card-line);
      border-radius: 22px;
      background: var(--card);
      overflow: hidden;
      isolation: isolate;
      text-decoration: none;
      color: inherit;
      transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), border-color 0.4s, box-shadow 0.4s;
    }
    .portal::before {
      content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0.9;
      background: radial-gradient(120% 80% at 15% 0%, var(--glow, transparent), transparent 60%);
      transition: opacity 0.4s;
    }
    .portal .halo {
      position: absolute; z-index: -1; width: 300px; height: 300px; right: -90px; top: -110px;
      border-radius: 50%; filter: blur(46px); opacity: 0.32;
      background: var(--accent); transition: opacity 0.4s, transform 0.5s;
    }

    .portal-live { --accent: var(--morning); --glow: rgba(56, 224, 160, 0.14); }
    .portal-live:hover, .portal-live:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(56, 224, 160, 0.55);
      box-shadow: 0 24px 60px -28px rgba(56, 224, 160, 0.6);
      outline: none;
    }
    .portal-live:hover .halo { opacity: 0.5; transform: scale(1.12); }
    .portal-live:hover .go { gap: 14px; }

    .portal-soon { --accent: var(--game); --glow: rgba(255, 157, 108, 0.10); cursor: default; }
    .portal-soon .icon, .portal-soon h2, .portal-soon .desc { opacity: 0.62; }

    /* Game portal — live + interactive, but on the coral (game) side of the palette. */
    .portal-game { --accent: var(--game); --glow: rgba(255, 157, 108, 0.14); }
    .portal-game:hover, .portal-game:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(255, 157, 108, 0.55);
      box-shadow: 0 24px 60px -28px rgba(255, 157, 108, 0.6);
      outline: none;
    }
    .portal-game:hover .halo { opacity: 0.5; transform: scale(1.12); }
    .portal-game:hover .go { gap: 14px; }

    .portal .icon {
      width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center;
      font-size: 27px; margin-bottom: auto;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-line);
    }

    /* ---- Icon 3D của thẻ Minigame ----
       Linh vật GLB tự xoay bằng <model-viewer> (vendor/, ~1MB đã gồm Three.js) — nạp
       SAU sự kiện load để không tranh băng thông với nội dung chính; trước đó và khi
       lỗi thì emoji 🎮 bên dưới vẫn hiện, trang không phụ thuộc script để dùng được.
       BẪY: model-viewer bắt sự kiện chuột dù không bật camera-controls — phải
       pointer-events:none, không thì cả vùng icon chặn click vào thẻ <a>. */
    /* Thẻ chia đôi bằng grid (class `portal-split`): linh vật 3D chiếm trọn nửa
       trái, chữ nửa phải. Dùng grid-area thay vì bọc thêm <div> để markup các thẻ
       vẫn đồng dạng nhau. Thẻ nào muốn có linh vật: thêm class này + khai
       `data-mascot="<đường dẫn .glb>"` trên .icon-3d. */
    .portal-split {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      grid-template-areas: "model title" "model desc" "model go";
      grid-template-rows: auto auto 1fr;
      column-gap: 22px;
    }
    .portal-split h2   { grid-area: title; }
    .portal-split .desc { grid-area: desc; }
    /* `go` dính đáy cột phải cho các thẻ cạnh nhau ngang hàng liên kết */
    .portal-split .go  { grid-area: go; align-self: end; }
    .portal .icon-3d {
      grid-area: model;
      position: relative;
      width: 100%; height: 100%; min-height: 190px;
      font-size: 64px; /* emoji fallback to theo khung lớn */
    }
    /* Màn hẹp: nửa trái + nửa phải không đủ chỗ cho chữ 30px — xếp dọc lại,
       linh vật thành dải ngang phía trên */
    @media (max-width: 560px) {
      .portal-split {
        grid-template-columns: 1fr;
        grid-template-areas: "model" "title" "desc" "go";
        grid-template-rows: 200px auto auto auto;
      }
      .portal-split h2 { margin-top: 14px; }
    }
    .icon-3d model-viewer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
      --poster-color: transparent;
    }
    /* Emoji chỉ ẩn khi model đã tải xong thật sự (JS gắn lớp này lúc nghe 'load') */
    .icon-3d.model-ready .icon-fallback { visibility: hidden; }
    .portal .status {
      position: absolute; top: 24px; right: 24px;
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .portal-live .status { color: var(--morning); }
    .portal-live .status .dot { box-shadow: 0 0 0 0 rgba(56, 224, 160, 0.7); animation: pulse 2s infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(56, 224, 160, 0.6); }
      70%  { box-shadow: 0 0 0 9px rgba(56, 224, 160, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 224, 160, 0); }
    }
    .portal-soon .status { color: var(--game); }
    .portal-game .status { color: var(--game); }

    .portal h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; margin-top: 20px; }
    .portal .desc { color: var(--muted); font-size: 14.5px; margin-top: 8px; max-width: 34ch; }
    .portal .go {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 20px;
      font-weight: 600; font-size: 14px; color: var(--accent); transition: gap 0.3s;
    }
    .portal .go .arrow { transition: transform 0.3s; }
    .portal-soon .go { color: var(--faint); }
    .portal-game .go { color: var(--game); }

    /* ── Footer ────────────────────────────────────────────────── */
    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 30px 20px 34px;
      color: var(--faint); font-size: 13px;
    }
    footer .sep { opacity: 0.4; margin: 0 8px; }

    @media (prefers-reduced-motion: reduce) {
      .aurora, .brand-fish, .bubbles span, .status .dot { animation: none; }
      .portal { transition: none; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="wrap">
    <header class="topline">
      <span class="brand">
        <span class="brand-fish" aria-hidden="true">🐟</span>
        <span class="brand-name">Cá <em>Mặn</em></span>
      </span>
    </header>

    <section class="hero">
      <span class="eyebrow">Chào bạn</span>
      <h1>Một góc nhỏ,<br><span class="swim">hai cửa để vào.</span></h1>
      <p>Sáng thì đọc tin cho tỉnh táo, rảnh thì vào chơi cho vui.</p>
    </section>

    <section class="portals" aria-label="Chọn khu vực">
      <a class="portal portal-live portal-split" href="/morning/">
        <span class="status"><span class="dot"></span>Đang chạy</span>
        <span class="icon icon-3d" data-mascot="./assets/morning-mascot.glb" aria-hidden="true">
          <span class="icon-fallback">🌅</span>
          <model-viewer auto-rotate rotation-per-second="24deg"
            interaction-prompt="none" disable-zoom disable-pan disable-tap
            camera-orbit="25deg 78deg auto" exposure="1.1"></model-viewer>
        </span>
        <h2>Morning</h2>
        <span class="desc">Bản tin tự động mỗi sáng 9h &amp; tối 22h, không lá cải.</span>
        <span class="go">Vào đọc <span class="arrow" aria-hidden="true">→</span></span>
      </a>

      <a class="portal portal-game portal-split" href="/game/">
        <span class="status"><span class="dot"></span>Mới mở</span>
        <!-- src gắn bằng JS (đọc data-mascot) sau khi vendor script nạp xong — để
             trình duyệt không tải GLB khi chưa có gì hiển thị được nó -->
        <span class="icon icon-3d" data-mascot="./assets/minigame-mascot.glb" aria-hidden="true">
          <span class="icon-fallback">🎮</span>
          <model-viewer auto-rotate rotation-per-second="24deg"
            interaction-prompt="none" disable-zoom disable-pan disable-tap
            camera-orbit="25deg 78deg auto" exposure="1.1"></model-viewer>
        </span>
        <h2>Minigame</h2>
        <span class="desc">Vài minigame tự làm, chạy thẳng trên trình duyệt.</span>
        <span class="go">Vào Arcade <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </section>
  </div>

  <footer>
    🐟 Cá Mặn Đau Lưng
  </footer>

  <script>
    /* Linh vật 3D thẻ Minigame — nạp trễ có chủ đích.
     *
     * VÌ SAO KHÔNG để <script type="module"> thẳng trong HTML: vendor nặng ~1MB,
     * nạp ngay là tranh băng thông với font và LCP của trang chủ vốn siêu nhẹ.
     * Đợi 'load' xong mới chèn; ai tắt JS / mạng lỗi / reduced-motion vẫn thấy 🎮.
     */
    (function () {
      var cacKhung = document.querySelectorAll('.icon-3d[data-mascot]');
      if (!cacKhung.length) return;

      var giamChuyenDong = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = './vendor/model-viewer/model-viewer.min.js';
        s.onload = function () {
          /* GLB nén Draco (60MB gốc → ~1MB mỗi con) — decoder phải trỏ về vendor/
             của MÌNH, không chỉnh thì model-viewer lặng lẽ tải decoder từ CDN Google,
             portal mất tính tự chứa và hỏng khi CDN bị chặn.
             BẪY ĐÃ SẬP: bản module min KHÔNG tạo global ModelViewerElement — guard
             `if (window.ModelViewerElement)` im lặng bỏ qua và decoder vẫn về gstatic.
             Phải lấy class qua customElements.get, và gán TRƯỚC khi đặt src. */
          customElements.whenDefined('model-viewer').then(function () {
            customElements.get('model-viewer').dracoDecoderLocation = './vendor/draco/';
            cacKhung.forEach(function (khung) {
              var mascot = khung.querySelector('model-viewer');
              if (!mascot) return;
              if (giamChuyenDong) mascot.removeAttribute('auto-rotate');
              mascot.addEventListener('load', function () { khung.classList.add('model-ready'); });
              /* Lỗi tải GLB (thiếu file, hỏng) → giữ nguyên emoji, gỡ viewer cho sạch */
              mascot.addEventListener('error', function () { mascot.remove(); });
              mascot.src = khung.getAttribute('data-mascot');
            });
          });
        };
        document.body.appendChild(s);
      });
    })();

    // Rising bubbles — generated once, respect reduced-motion.
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const root = document.getElementById('bubbles');
      const N = 14;
      for (let i = 0; i < N; i++) {
        const b = document.createElement('span');
        const size = 6 + Math.round(Math.random() * 22);
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.round(Math.random() * 100) + 'vw';
        b.style.setProperty('--sway', (Math.random() * 60 - 30).toFixed(0) + 'px');
        b.style.animationDuration = (11 + Math.random() * 12).toFixed(1) + 's';
        b.style.animationDelay = (-Math.random() * 18).toFixed(1) + 's';
        root.appendChild(b);
      }
    })();
  </script>
</body>
</html>
